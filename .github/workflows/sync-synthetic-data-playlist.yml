name: Sync Synthetic Data Playlist

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no transcript writes / no archive push)"
        required: false
        default: "true"
      video_id:
        description: "Optional single playlist video ID for smoke testing"
        required: false
        default: ""
      push:
        description: "Push archive to GitHub after sync (requires dry_run=false)"
        required: false
        default: "false"

concurrency:
  group: sync-synthetic-data-playlist
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run unit tests
        run: pytest -q

      - name: Sync Synthetic Data playlist
        env:
          TRANSCRIPT_API_KEY: ${{ secrets.TRANSCRIPT_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          ARCHIVE_ROOT: archive
          ARCHIVE_GITHUB_REPO: ${{ secrets.ARCHIVE_GITHUB_REPO }}
          ARCHIVE_GITHUB_TOKEN: ${{ secrets.ARCHIVE_GITHUB_TOKEN }}
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.dry_run || 'true' }}" = "true" ]; then
            ARGS="--dry-run"
          fi
          if [ -n "${{ github.event.inputs.video_id }}" ]; then
            ARGS="$ARGS --video-id ${{ github.event.inputs.video_id }}"
          fi
          if [ "${{ github.event.inputs.push || 'false' }}" = "true" ]; then
            ARGS="$ARGS --push"
          fi
          python sync_synthetic_data_playlist.py $ARGS
