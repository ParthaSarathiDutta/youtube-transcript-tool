name: Daily YouTube Digest

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no email send / no archive push)"
        required: false
        default: "true"
      video_id:
        description: "Optional single video ID for smoke testing"
        required: false
        default: ""
  # schedule:
  #   - cron: "0 7 * * *"
  #     timezone: America/Chicago
  # Enable after transcript smoke on ubuntu-latest and operator approval.

concurrency:
  group: daily-youtube-digest
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run unit tests
        run: pytest -q

      - name: Transcript smoke (GitHub runner)
        env:
          VIDEO_ID: ${{ github.event.inputs.video_id }}
        run: |
          export VID="${VIDEO_ID:-BOWYujhIQuo}"
          python - <<'PY'
          import os
          from transcript_service import fetch_transcript
          vid = os.environ["VID"]
          result = fetch_transcript(vid)
          print("video_id", vid)
          print("available", result.available, "provider", result.provider)
          if not result.available or len(result.display_text) < 100:
              raise SystemExit("Transcript smoke failed on runner")
          PY

      - name: Run daily pipeline
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          ARCHIVE_ROOT: archive
          ARCHIVE_GITHUB_REPO: ${{ secrets.ARCHIVE_GITHUB_REPO }}
          ARCHIVE_GITHUB_TOKEN: ${{ secrets.ARCHIVE_GITHUB_TOKEN }}
          EMAIL_SMTP_HOST: ${{ secrets.EMAIL_SMTP_HOST }}
          EMAIL_SMTP_PORT: ${{ secrets.EMAIL_SMTP_PORT }}
          EMAIL_SMTP_USER: ${{ secrets.EMAIL_SMTP_USER }}
          EMAIL_SMTP_PASSWORD: ${{ secrets.EMAIL_SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          if [ "${{ github.event.inputs.dry_run || 'true' }}" = "true" ]; then
            ARGS="--dry-run"
          else
            ARGS="--send-email"
          fi
          if [ -n "${{ github.event.inputs.video_id }}" ]; then
            ARGS="$ARGS --video-id ${{ github.event.inputs.video_id }}"
          fi
          python run_daily.py $ARGS
